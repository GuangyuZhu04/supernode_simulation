[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supernode-sim"
version = "0.1.0"
description = "Traceable analytical and discrete-event supernode resource modeling"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
snmodel = "supernode_sim.cli:main"

[tool.setuptools.packages.find]
include = ["supernode_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
