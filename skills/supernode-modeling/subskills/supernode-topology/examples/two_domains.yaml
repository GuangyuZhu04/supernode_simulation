# Natural-language request and unit notes: ../references/specification.md
# Synthetic demonstration rates; no production hardware or workload is implied.
schema_version: '1.0'
name: synthetic-8npu-two-so-domains
npu_count: 8
su_size: 2
npus_per_host: 2
scale_up:
  topology: full_mesh
  bandwidth_Bps: 9.0e+11
  latency_s: 1.0e-6
  efficiency: 0.85
  injection_Bps: 9.0e+11
scale_out:
  topology: clos
  bandwidth_Bps: 5.0e+10
  latency_s: 5.0e-6
  efficiency: 0.8
  injection_Bps: 5.0e+10
  uplink_Bps: 5.0e+10
  leaf_size: 2
  spine_count: 2
  domains:
    - id: so-a
      su_domains: [0, 1]
    - id: so-b
      su_domains: [2, 3]
host_link:
  bandwidth_Bps: 6.4e+10
  latency_s: 2.0e-6
  efficiency: 0.85
  injection_Bps: 6.4e+10
inter_domain_links:
  - id: so-a-to-so-b
    src_domain: so-a
    dst_domain: so-b
    bandwidth_Bps: 5.0e+10
    latency_s: 5.0e-6
    efficiency: 0.8
  - id: so-b-to-so-a
    src_domain: so-b
    dst_domain: so-a
    bandwidth_Bps: 5.0e+10
    latency_s: 5.0e-6
    efficiency: 0.8
