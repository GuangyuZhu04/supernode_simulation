  <g id="page-header">
    <text x="50" y="50" font-size="28" font-weight="bold" fill="#C00000">10T 推理需同时满足显存峰值、HBM 带宽与低时延互联</text>
    <text x="50" y="77" font-size="12" fill="#666666">02 集群要求 · 已仿真的部署条件；以下资源指标采用 1M 输入、batch=1、top-32、output=2</text>
  </g>
