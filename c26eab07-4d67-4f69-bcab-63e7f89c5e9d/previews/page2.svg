  </g><text x="501" y="198" font-size="15" font-weight="bold" fill="#1D1D1A">计算与访存：分阶段配置资源</text>
    <text x="470" y="241" font-size="12" fill="#666666">每卡规格</text>
    <text x="650" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#1D1D1A">950DT</text>
    <text x="761" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#1D1D1A">960DT</text>
    <line x1="470" y1="252" x2="810" y2="252" stroke="#D9D9D9" stroke-width="1" />
    <text x="470" y="277" font-size="12" fill="#1D1D1A">HBM 容量</text>
    <text x="650" y="277" text-anchor="middle" font-size="12" fill="#1D1D1A">144 GB</text>
    <text x="761" y="277" text-anchor="middle" font-size="12" fill="#1D1D1A">288 GB</text>
    <line x1="470" y1="289" x2="810" y2="289" stroke="#D9D9D9" stroke-width="1" />
    <text x="470" y="314" font-size="12" fill="#1D1D1A">HBM 带宽</text>
    <text x="650" y="314" text-anchor="middle" font-size="12" fill="#1D1D1A">4 TB/s</text>
    <text x="761" y="314" text-anchor="middle" font-size="12" fill="#1D1D1A">9.6 TB/s</text>
    <line x1="470" y1="326" x2="810" y2="326" stroke="#D9D9D9" stroke-width="1" />
    <text x="470" y="351" font-size="12" fill="#1D1D1A">FP8 标称峰值</text>
    <text x="650" y="351" text-anchor="middle" font-size="12" fill="#1D1D1A">1 PFLOP/s</text>
    <text x="761" y="351" text-anchor="middle" font-size="12" fill="#1D1D1A">2 PFLOP/s</text>
    <text x="470" y="375" font-size="10.5" fill="#666666">两平台计算效率均假设 50%</text>
    <text x="470" y="422" font-size="38" font-weight="bold" fill="#C00000">8.34<tspan font-size="15" fill="#1D1D1A"> TB/步</tspan></text>
    <text x="470" y="447" font-size="15" fill="#1D1D1A">decode 集群累计 HBM 读写</text>
    <text x="470" y="483" font-size="12" fill="#1D1D1A">prefill 计算量：1.611 EFLOP</text>
    <text x="470" y="515" font-size="10.5" fill="#666666">HBM 读写量为累计流量，不是存储容量</text>
  </g>
  <g id="network-requirement">
    <rect x="850" y="172" width="380" height="360" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" />
