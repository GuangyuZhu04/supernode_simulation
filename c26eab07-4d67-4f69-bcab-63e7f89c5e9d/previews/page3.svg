    <text x="68" y="261" font-size="12" fill="#1D1D1A">模型张量、输入/输出长度与固定 batch</text>
    <text x="68" y="292" font-size="15" font-weight="bold" fill="#1D1D1A">并行 · 拓扑 · 目标</text>
    <text x="68" y="314" font-size="12" fill="#1D1D1A">并行策略、SU/SO 链路图与 SLO</text>
    <line x1="68" y1="332" x2="382" y2="332" stroke="#D9D9D9" stroke-width="1" />
