assumptions:
- Optimizer updates use two in-flight component buckets per rank to bound staging and preserve transfer/compute overlap; this is an explicit scheduler assumption.
- Ascend950DT/Atlas950 announced roadmap profile, not a measured installed platform.950DT
  Q4 2026 availability was stated in2025;2026MWC confirmed cabinet scale, not measured
  performance.
- 64NPUs are a cabinet slice inside an up-to8192-NPU design. All SI capacity/bandwidth
  values use decimalbytes; perchip144GB interpretation does not silently adopt inconsistent
  published1152TBaggregate.
- Text backbone tensor counts are shape-derived, not rounded2.8T budgets. Vision encoder/projector
  and training MTP are excluded; published training report has1MTP but releasedconfig
  has0.
- Official model uses SiTU-GLU, gated MLA and KDA+AttnRes; generic kernel timing,
  fused working sets and uniform expert routing remain uncalibrated.
- Released checkpoint has MXFP4 routed experts with32-element groups anduint8scale;
  primaryFP8/FP16cases are controlled reprecision studies, not exact checkpoint storage.
- Latency/throughput are analytical predictions, not Kimi production benchmarks. No
  queueing/continuousbatching/prefixcaching. TTFT begins after weights loaded.
- Detailed productionK3 training uses MoonEP, virtualPP,PipelineZeRO2,activationoffload/remoteoffload
  andP2PMuon; genericFSdP/optimizer baseline does not reproduce those mechanisms.
- 64-NPU FP8weights+FP16gradients may exceed144GB/NPU despite optimizeroffload. Preserve
  infeasible outcome; do not inflateHBM to force fit. CPUoffload variant is a designstudy
  and is not publishedproductionMuondeployment.
- 128-NPU two-domain topology is a design alternative. Actual Atlas950 UB can span
  multiple cabinets as oneSU. Distributed Muon ownership/gather and orthogonalization
  implementation need platform profiling; runtime is not productionvalidated.
- MLA cache_layout=compressed is an explicit optimized cache assumption, not the official
  HF reference cache implementation. Compare expanded layout using examples/sweep_kimi_k3_kv_layout.yaml.
  NoPE skips positional encoding but retains the 64-dimensional key projection.
