    status: assumed
    description: Synthetic local example; all device rates and model dimensions are illustrative.
assumptions:
  - The serving wrapper replicates this entire hardware configuration into isolated instances.
  - No measured serving calibration, client preprocessing or shared inter-instance network is implied.
