  name: synthetic-serving-device
  npu_count: 1
  su_size: 1
  npus_per_host: 1
  npu:
    hbm_bytes: 67108864
    hbm_Bps: 1000000000
    flops: {fp16: 1000000000, bf16: 1000000000, fp32: 100000000}
