# Small routed model of a protected parameter-network port losing one member.
model:
  name: synthetic-dense-pretraining
  layers: 1
  hidden_dim: 64
  num_heads: 4
  kv_heads: 2
  head_dim: 16
  architecture:
    vocab_size: 512
    attention_by_layer: [GQA]
    ffn_by_layer: [Dense]
    dense_intermediate_dim: 128
hardware:
  name: Atlas 950 protected-port scenario on a synthetic four-card topology
  npu_count: 4
  su_size: 2
  npus_per_host: 2
  scale_out: {bandwidth_Bps: 200000000, host_injection_Bps: 100000000, efficiency: 1}
execution:
  dp: 2
  tp: 2
  rank_order: [0, 2, 1, 3]
workload:
  scenario: training
  batch_size: 1
  sequence_length: 64
  training_steps: 2
  training:
    kind: pretrain
    pretrain:
      dataset_tokens: 131072
      reliability:
        horizon_s: 200
        checkpoint_interval_steps: 50
        checkpoint_write_s: 0.008
        policy: {mode: global_restart, rebuild_s: 0.2, restore_s: 0.3}
        faults:
          protected_port:
            scope: link
            resources: [cpu0.nic.tx, cpu0.nic.rx]
            bandwidth_fraction: 0.5
            repair_s: 1
          card_loss: {scope: card, detect_s: 0.1, repair_s: 0.4}
        trace:
          - {at_s: 0.01, fault: protected_port}
          - {at_s: 0.18, fault: card_loss, target: 2}
sources:
  '*': {status: assumed, description: 'Synthetic training shape, topology, capacities and recovery durations.'}
  protected_port:
    status: public
    description: Atlas 950 parameter-plane optical module bond protection permits continued service at half bandwidth.
    uri: https://support.huaweicloud.com/resmgmt-modelarts/resmgmt-a5_0007.html
