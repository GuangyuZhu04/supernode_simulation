<script>
(() => {
  const root=document.getElementById('sn-case-film');

  const overviewSteps=[
    [0,'两条请求进入同一批次','请求 A：128 → 4 token；请求 B：64 → 2 token。权重已预载，模型与硬件均为合成案例。','准备'],
    [6,'读取 Engram，开始 Prefill','第 0 层先查询 Host 中的 Engram 表；随后执行 attention / dense，处理请求的输入上下文。','Prefill'],
    [9,'Prefill：计算上下文表示','四层模型处理输入。图中随后聚焦一次 MoE 层：先执行 attention / dense，再分发给专家。','Prefill'],
    [12,'Host 参与：保存 KV 状态','本例 KV offload 到 Host；HBM 仍保留临时 buffer。金色数据流表示新 KV 搬运到主机内存。','Prefill'],
    [18,'Dispatch：把工作送到对应专家','EP 组 0↔2、1↔3 跨越两个 SU 域；紫色粒子表示专家输入经过 SO 链路。','Prefill'],
    [25,'专家并行计算','8 个专家按 EP 划分，Top-2 路由按均匀假设建模；两个域中的 NPU 都可能参与。','Prefill'],
    [30,'Combine：专家结果沿网络返回','专家计算完成后执行 combine，把结果归并回原来的请求处理路径。','Prefill'],
    [36,'TP 同步：合并分片结果','本预算版 MoE 层在 combine 后执行两次 TP AllReduce；0↔1、2↔3 分别走域内 SU。','Prefill'],
    [42,'首 token 就绪：A₁、B₁','完整 Prefill 结束产生各请求的首 token；TTFT 从开始执行量到首 token 完成。','首 token'],
    [46,'Decode：读旧 KV，再计算新 token','每轮读取已有 KV、执行计算与通信、写入新增 KV。这里开始生成 A₂、B₂。','Decode'],

  ];
  const details=[
    ['输入与校验','把模型、负载、并行、硬件和目标固化为场景；普通布局 TP×PP×EP×DP 必须匹配卡数。','输入 → 配置校验 → 可重跑快照'],
    ['rank 与物理拓扑','本例 rank 0/1 同属 SU A、2/3 同属 SU B；TP 在域内，EP 跨域，实际链路决定争用。','TP：0↔1 / 2↔3 · EP：0↔2 / 1↔3'],
    ['事件图与可选策略','计算、通信、分配和释放组成依赖图。offload、checkpoint、SP、融合、投机与 PD 按配置改变事件。','依赖 → 就绪 → 执行 → 后继'],

    ['资源调度与内存准入','事件同时受计算、HBM、链路和槽位约束。容量不足先等待，释放后再准入；按事件边界推进。','就绪 → 准入 → 共享速率 → 完成 / 释放'],
    ['指标、归因与报告','记录 token 完成时间；关键路径拆解计算、通信和等待。峰值取同一时刻的存活内存，不叠加独立峰值。','完成事件 → TTFT / TPOT → 报告'],
    ['搜索与大规模执行','候选逐一校验。feedback 联合运行 Prefill/Decode；流式按屏障分块，参考检查点用于继续已完成数值计算后的导出。','候选 → 完整验证 → 有限集合内推荐']
  ];
  select.innerHTML=details.map((d,i)=>'<option value="'+i+'">'+(i+1)+' / 8 · '+d[0]+'</option>').join('');
  let t=0,running=!reduced.matches,last=null,lastText='',W=Math.max(280,root.clientWidth||736),H=550,S='',mobile=false;
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=v=>String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.floor(v%60)).padStart(2,'0');
  function rect(x,y,w,h,fill,rx=0,stroke='none',sw=1,opacity=1) {S+='<rect x="'+x+'" y="'+y+'" width="'+Math.max(0,w)+'" height="'+Math.max(0,h)+'" rx="'+rx+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" opacity="'+opacity+'"/>';}
  function path(points,color,width=1.5,opacity=1) {S+='<path d="M'+points.map(p=>p.join(',')).join(' L')+'" fill="none" stroke="'+color+'" stroke-width="'+width+'" stroke-linecap="round" stroke-linejoin="round" opacity="'+opacity+'"/>';}
  function poly(points,fill,stroke='none') {S+='<polygon points="'+points.map(p=>p.join(',')).join(' ')+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1"/>';}
  function circle(x,y,r,fill,opacity=1) {S+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" opacity="'+opacity+'"/>';}
  function label(x,y,value,size=13,color=C.text,anchor='middle',weight=400) {S+='<text x="'+x+'" y="'+y+'" fill="'+color+'" font-size="'+size+'" font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="'+anchor+'" font-weight="'+weight+'">'+esc(value)+'</text>';}
  function packet(points,phase,color,n=4) {
    const lengths=points.slice(1).map((b,i)=>Math.hypot(b[0]-points[i][0],b[1]-points[i][1]));const total=lengths.reduce((a,b)=>a+b,0);
    path(points,color,2,.8);
    for(let j=0;j<n;j++) {let dist=((phase+j/n)%1)*total;for(let k=0;k<lengths.length;k++){if(dist<=lengths[k]||k===lengths.length-1){const q=lengths[k]?dist/lengths[k]:0,x=points[k][0]+(points[k+1][0]-points[k][0])*q,y=points[k][1]+(points[k+1][1]-points[k][1])*q;circle(x,y,9,color,.10);rect(x-3,y-2.5,6,5,color,1);break;}dist-=lengths[k];}}
  }
  function chip(cx,cy,id,active,pressure,phase) {
    const cw=mobile?58:70,ch=46;
    rect(cx-cw/2-8,cy-ch/2-7,cw+16,ch+14,'#132b3c',5,'#3c5c70');
    for(let i=0;i<6;i++){const px=cx-cw/2+6+i*(cw-12)/5;rect(px-1,cy-ch/2-6,2,5,'#a8aa87');rect(px-1,cy+ch/2+1,2,5,'#a8aa87');}
    rect(cx-cw/2,cy-ch/2,cw,ch,active?'#173d3a':'#1c3047',4,active?C.compute:'#5a738b',1.2);
    for(let row=0;row<2;row++)for(let col=0;col<4;col++){const lit=active&&((Math.floor(phase*7)+row+col)%4!==0);rect(cx-cw/2+7+col*(cw-14)/4,cy-16+row*11,(cw-22)/4,7,lit?C.compute:'#355365',1, 'none',1,lit?.85:.6);}
    label(cx,cy+15,'NPU '+id,12,C.text);
    const mx=cx+cw/2+13;for(let i=0;i<5;i++)rect(mx,cy+19-i*9,7,6,i<Math.round(pressure*5)?C.host:'#30485e',1);

  }
  function rack(cx,y,domain,rank0,state) {
    const fw=mobile?108:148,dep=mobile?12:20,rh=197,x=cx-fw/2;
    S+='<ellipse cx="'+(cx+dep/2)+'" cy="'+(y+rh+17)+'" rx="'+(fw*.67)+'" ry="16" fill="#030a13" opacity=".65"/>';
    poly([[x,y],[x+dep,y-14],[x+fw+dep,y-14],[x+fw,y]],'url(#sf-metal-top)','#57748b');
    poly([[x+fw,y],[x+fw+dep,y-14],[x+fw+dep,y+rh-14],[x+fw,y+rh]],'url(#sf-metal-side)','#3a5269');
    rect(x,y,fw,rh,'url(#sf-metal-front)',5,'#648096',1);
    rect(x+7,y+9,fw-14,24,'#0b1929',3);
    label(cx,y+26,'SU '+domain+' · Host '+domain,12,C.text);
    for(let k=0;k<3;k++)circle(x+13+k*8,y+40,1.8,k===0?C.compute:'#57738b');
    label(x+fw-22,y+44,'HBM',11,C.muted);
    const chipX=cx-(mobile?7:12),chips=[];
    for(let i=0;i<2;i++){
      rect(x+7,y+49+i*70,fw-14,65,'#0d1b2b',3,'#30485d');
      chips.push(chip(chipX,y+81+i*70,rank0+i,state.compute,state.memory,state.phase+i));
    }
    const sx=x+fw-5;
    const suPath=[[chips[0].x+(mobile?29:35)+8,chips[0].y],[sx,chips[0].y],[sx,chips[1].y],[chips[1].x+(mobile?29:35)+8,chips[1].y]];
    path(suPath,'#375568',1.5);if(state.su){packet(suPath,state.phase,C.su,3);packet(suPath.slice().reverse(),state.phase+.18,C.su,2);}
    label(cx,y+rh+33,'NPU '+rank0+' ↔ '+(rank0+1)+' · TP2',12,C.muted);
    if(state.mapping){label(cx,y-29,'EP lane '+(rank0/2),12,C.so);}
    return {x:cx,top:y-14,bottom:y+rh,chips,fw};
  }
  function hostMemory(cx,y,name,kvAmount,flow,phase) {
    const mw=mobile?110:150,x=cx-mw/2;
    poly([[x,y],[x+10,y-7],[x+mw+10,y-7],[x+mw,y]],'#42536a','#64758b');
    poly([[x+mw,y],[x+mw+10,y-7],[x+mw+10,y+42],[x+mw,y+49]],'#172c42','#53677c');

    const route=[[cx+mw/2+10,y-42],[cx+mw/2+10,y-7],[cx+mw/2,y-7]];path(route,'#5d574a',1.5);if(flow)packet(flow==='read'?route.slice().reverse():route,phase,C.host,2);
  }
  function tokens(x,y,name,max,done,complete) {
    label(x,y+5,name,13,C.text,'start',500);
    const gap=mobile?23:31,start=x+27;
    for(let k=0;k<max;k++){const xx=start+k*gap;rect(xx,y-11,mobile?19:25,25,k<done?'#174d47':'#172c42',4,k<done?'#65edb7':'#52697f');label(xx+(mobile?9.5:12.5),y+6,String(k+1),12,k<done?'#a6ffdc':'#809ab1');}
    if(complete&&!mobile)label(start+max*gap+4,y+6,'完成',12,C.compute,'start');
  }
  function stateAt(time,detailIndex) {
    const inDetail=detailIndex>=0;
    const v={compute:false,su:false,so:false,reverse:false,flow:false,memory:.25,kv:.12,phase:time*.47,mapping:false,a:0,b:0};
    if(!inDetail){
      v.compute=(time>=9&&time<12)||(time>=25&&time<30)||(time>=46&&time<56);
      v.flow=time>=6&&time<9?'read':time>=12&&time<18?'write':time>=46&&time<56?(time%3<1.5?'read':'write'):false;
      v.so=(time>=18&&time<25)||(time>=30&&time<36)||(time>=46&&time<56);
      v.reverse=(time>=30&&time<36)||(time>=46&&time%4>2);
      v.su=(time>=36&&time<42)||(time>=46&&time<56&&time%3>1.5);
      v.memory=v.compute?.55+.16*Math.sin(time*1.3):.25;
      v.kv=time<12?.12:time<18?.12+.46*(time-12)/6:time<46?.58:Math.min(.8,.58+(time-46)*.022);
      v.a=time<42?0:time<48?1:time<52?2:time<56?3:4;v.b=time<42?0:time<48?1:2;

      const u=(time-60-detailIndex*9)/9;v.kv=.65;v.mapping=detailIndex===1;

  function detailStrip(index,u,y) {
    if(index<0)return;

      const col=(right-left)/3;labels.forEach((v,i)=>{label(left+col*(i+.5),y+7,v,mobile?11:13,i===1?C.host:C.text);rect(left+i*col+8,y+22,col-16,5,i===1?C.host:C.compute,2);});

    }else if(index===6){
      const docs=['配置 + 来源','JSON / CSV','时间线 + 报告'];const col=(W-36)/3;
      docs.forEach((v,i)=>{const x=18+i*col;rect(x,y-12,col-12,46,'#142b40',3,'#436179');label(x+(col-12)/2,y+16,v,mobile?11:13,C.text);});

    }else{
      const lines=[['场景输入','严格校验','配置快照'],['逻辑 rank','物理 NPU','实际路径'],['计算事件','通信事件','分配 / 释放'],['分发 → 计算','聚合 → 同步','路径计费'],[],[],[],['枚举候选','逐项执行','排序 / 复跑']][index];
      const gap=(W-36)/3;lines.forEach((v,i)=>{label(18+gap*(i+.5),y+8,v,mobile?11:13,Math.floor(u*3)===i?C.compute:C.text);if(i<2)path([[18+gap*(i+1)-10,y+25],[18+gap*(i+1)+10,y+25]],C.faint,1.5);});

  function renderScene(d) {
