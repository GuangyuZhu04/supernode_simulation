    }else{
      caption='逐层工作量经依赖与资源调度形成完成时间；表中是同一关键路径的可加归因，不能再加上另一套“组件耗时”表。';
      html=eq('TTFT / TPOT 的产生',c.id==='kimi'?'首 token 完成于 89.3734014426 s；第二 token 完成于 89.4158242624 s；差值为 42.4228197409 ms。':'独立 Prefill 完成时间作为其 TTFT 预测；独立单步 Decode 给出下一 token 服务耗时，不构造联合 E2E。')+eq('为什么小消息仍受启动影响',c.id==='kimi'?'关键依赖链上 17,298 × 2.1 μs = 36.3258 ms。不是把 1024 卡的启动时间累加。':'Decode 通信启动 = 14.3844 ms；其中含 SU 与 Host 各自的启动边界，不能统一套一个 α。')+eq('完整工作流的收尾','保存输入、来源、指标和失败原因；sweep / size-su / feedback 对候选重新校验并调用对应执行路径。');
    }
    $('tf-caption').textContent=caption;$('tf-equations').innerHTML=html;
    $('tf-table-wrap').hidden=index!==5;
    if(index===5){const p=c.phases.prefill,d=c.phases.decode;$('tf-breakdown').innerHTML=p.pieces.map((v,i)=>'<tr><td><span class="tf-dot" style="background:'+C[v[2]]+'"></span>'+esc(v[0])+'</td><td>'+n(v[1],6)+'</td><td>'+n(d.pieces[i][1]*1000,6)+'</td></tr>').join('');$('tf-total').innerHTML='<tr><th>归档总时延</th><td>'+n(p.duration,6)+'</td><td>'+n(d.duration*1000,6)+'</td></tr>';}
  }
  function sourceContent(c){
    $('tf-config').textContent='Ascend 950DT × 1024 · 1M = 1,048,576 token · batch 1 · '+c.layout;
    $('tf-sources').innerHTML='<p>'+esc(c.params+'。'+c.assumptions)+'</p><p>'+esc(c.method+'。'+c.scope)+'</p><p>'+esc(c.workNote)+' 所选配置无实测 kernel profile；计算效率、带宽和启动时间是保存的建模输入。</p><p>所选两实验直接调用对应的数值执行路径。通用完整图 estimate 可以先求必要下界，但下界不能证明可行。</p><p>单 SU 内逻辑 full-mesh；SO = 0。仅复现归档口径，不把两个模型当作同架构速度比赛。</p><p>关键文件：</p>'+c.sources.map(s=>'<div class="tf-source-path"><code>'+esc(s)+'</code></div>').join('');
  }
  function draw(){
    const c=D.cases[caseId],q=c.phases[phase],e=q.event;let index=steps.findIndex(s=>time<s.end);if(index<0)index=5;const s=steps[index],u=clamp((time-s.start)/(s.end-s.start));
    const key=caseId+'|'+phase+'|'+index;if(key!==lastContent){$('tf-title').textContent=s.title;$('tf-mode').textContent=index===0?'先看整体':'再看计算过程';content(c,q,e,index);sourceContent(c);lastContent=key;}
    S='<title id="tf-svg-title">'+esc(c.name+'：'+s.title)+'</title><desc id="tf-svg-desc">数值来自既有仿真结果。计算与HBM取最大约束，通信计入每轮启动与资源服务，最终由实际完成记录导出指标。</desc>';
    if(index===0)overview(c,u);if(index===1)mapping(c,q,e,u);if(index===2)compute(c,e,u);if(index===3)network(c,e,u);if(index===4)scheduler(c,e,u);if(index===5)aggregate(c,u);
    svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('height',String(H));svg.innerHTML=S;
    stepSelect.value=String(index);caseSelect.value=caseId;slider.value=String(time);slider.setAttribute('aria-valuetext',ft(time)+'，'+s.title);play.textContent=time>=150?'重播':running?'暂停':'播放';$('tf-clock').textContent=ft(time)+' / 02:30';
    $('tf-prefill').setAttribute('aria-pressed',String(phase==='prefill'));$('tf-decode').setAttribute('aria-pressed',String(phase==='decode'));root.dataset.case=caseId;root.dataset.phase=phase;root.dataset.step=String(index);root.dataset.playing=String(running);
  }
  function save(){if(window.openai&&typeof window.openai.setWidgetState==='function'){const p=window.openai.setWidgetState({modelContent:{case:D.cases[caseId].name,phase,step:steps[Number(root.dataset.step)].title},privateContent:{version:3,time,caseId,phase,running}});if(p&&p.catch)p.catch(()=>{});}}
  function restore(st){const p=st&&st.privateContent;if(!p||p.version!==3)return;if(D.cases[p.caseId])caseId=p.caseId;if(['prefill','decode'].includes(p.phase))phase=p.phase;if(Number.isFinite(p.time))time=clamp(p.time,0,150);running=!!p.running&&!reduced.matches&&time<150;last=null;draw();}
  play.addEventListener('click',()=>{if(time>=150){time=0;running=true;}else running=!running;last=null;draw();save();});
  caseSelect.addEventListener('change',()=>{caseId=caseSelect.value;last=null;draw();save();});
  stepSelect.addEventListener('change',()=>{time=steps[Number(stepSelect.value)].start;last=null;draw();save();});
  $('tf-prefill').addEventListener('click',()=>{phase='prefill';draw();save();});$('tf-decode').addEventListener('click',()=>{phase='decode';draw();save();});
  slider.addEventListener('input',()=>{time=clamp(Number(slider.value),0,150);last=null;if(time>=150)running=false;draw();});slider.addEventListener('change',save);
  window.addEventListener('openai:set_globals',e=>{if(e.detail&&e.detail.globals)restore(e.detail.globals.widgetState);});document.addEventListener('visibilitychange',()=>{last=null;});
  reduced.addEventListener('change',()=>{if(reduced.matches){running=false;draw();}});
  const ro=new ResizeObserver(es=>{W=Math.max(280,es[0].contentRect.width);draw();});ro.observe(root);
  function tick(now){if(running&&!document.hidden){if(last!==null)time=Math.min(150,time+Math.min((now-last)/1000,.15));last=now;if(time>=150)running=false;draw();}else last=null;requestAnimationFrame(tick);}
  restore(window.openai&&window.openai.widgetState);draw();requestAnimationFrame(tick);
})();
</script>
