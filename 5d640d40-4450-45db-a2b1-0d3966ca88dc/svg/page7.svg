" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">C=3</text><text x="855" y="341.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">8.873</text><text x="954" y="341.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">2.21×</text><text x="1099" y="341.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">2.645</text><text x="1206" y="341.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">1.93×</text><line x1="656" y1="352" x2="1214" y2="352" stroke="#D9D9D9" stroke-width="1"/><rect x="656" y="352" width="558" height="31" rx="0" fill="#FFF1EF" stroke="none" stroke-width="1"/><text x="664" y="372.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">C=4</text><text x="855" y="372.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="end" xml:space="preserve">6.654</text><text x="954" y="372.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="end" xml:space="preserve">2.95×</text><text x="1099" y="372.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="end" xml:space="preserve">1.984</text><text x="1206" y="372.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="end" xml:space="preserve">2.58×</text><line x1="656" y1="383" x2="1214" y2="383" stroke="#D9D9D9" stroke-width="1"/><text x="664" y="403.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">C=5</text><text x="855" y="403.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">5.324</text><text x="954" y="403.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">3.69×</text><text x="1099" y="403.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">1.587</text><text x="1206" y="403.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">3.22×</text><line x1="656" y1="414" x2="1214" y2="414" stroke="#D9D9D9" stroke-width="1"/><text x="664" y="434.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">C=6</text><text x="855" y="434.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">4.436</text><text x="954" y="434.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">4.42×</text><text x="1099" y="434.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">1.323</text><text x="1206" y="434.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">3.86×</text><line x1="656" y1="445" x2="1214" y2="445" stroke="#D9D9D9" stroke-width="1"/><rect x="656" y="460" width="558" height="63" rx="3" fill="#F2F2F2" stroke="none" stroke-width="1"/><text x="670" y="483" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#C00000" font-weight="bold">收益门槛 C≥2</tspan><tspan fill="#1D1D1A" font-weight="normal">：C=1 仅 0.74× / 0.64×</tspan></text><text x="670" y="508" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">C=2 达 1.47× / 1.29×；额外轮成本开始被提交数摊薄</text></g><g id="highlight-strip"><rect x="50" y="574" width="1180" height="68" rx="4" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="72" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">本页亮点</text><text x="180" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">★ C=4 条件收益：950DT </tspan><tspan fill="#C00000" font-weight="bold">2.95×</tspan><tspan fill="#1D1D1A" font-weight="normal">；960DT </tspan><tspan fill="#C00000" font-weight="bold">2.58×</tspan><tspan fill="#1D1D1A" font-weight="normal">，不混入布局优化收益</tspan></text><text x="180" y="625" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">★ C 是提交数；TPOT=round/C 是折算服务成本，</tspan><tspan fill="#C00000" font-weight="bold">不等于客户端 ITL</tspan></text></g><g id="source-note-0"><text x="50" y="552" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">布局 TP/EP/DP/SP：950DT 8/32/4/8；960DT 4/16/16/4。C∈[1,6] 为条件输入，接受率与文本质量未实测。</text></g><g id="source-note-1"><text x="50" y="565" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">来源：2026-10-20 仿真 summary.csv、dspark_round_breakdown.csv、methodology.md；循环路由条件，无真实 serving 校准。</text></g><g id="footer-group" font-family="Arial, sans-serif" font-size="10.5" fill="#1D1D1A"><text x="77" y="683">7</text><text x="125" y="683">Huawei Proprietary - Restricted Distribution</text><image href="logo.png" x="1070" y="663" width="133" height="28" preserveAspectRatio="xMidYMid meet"/></g></svg>