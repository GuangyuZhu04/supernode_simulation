<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF"/><g id="page-header"><text x="50" y="50" font-family="微软雅黑, Arial, sans-serif" font-size="28" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">DSpark 在 C=4 条件下，同布局折算提速 2.95× / 2.58×</text><text x="50" y="77" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">按草稿、目标验证、状态提交三阶段计费；固定 1M、decode bs32，对照同平台的 AR 最优布局</text></g><g id="core-band"><rect x="50" y="96" width="1180" height="62" rx="4" fill="#FFF1EF" stroke="#C00000" stroke-width="1.5"/><use data-icon="chunk-filled/target-arrow" x="70" y="115" width="22" height="22" fill="#C00000"/><text x="104" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">核心思想</text><line x1="180" y1="110" x2="180" y2="146" stroke="#F1B4B7" stroke-width="1"/><text x="200" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">5 个草稿位置、6 个目标查询共同完成一轮；</tspan><tspan fill="#C00000" font-weight="bold">C≥2</tspan><tspan fill="#1D1D1A" font-weight="normal"> 才在当前条件下超过同布局 AR</tspan></text></g><g id="dspark-process-panel"><rect x="50" y="172" width="570" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="50" y="172" width="570" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/arrows-repeat" x="62" y="176" width="20" height="20" fill="#C00000"/><text x="90" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">一轮包含完整验证与非零状态提交</text></g><g id="dspark-stage-1"><rect x="66" y="215" width="164" height="76" rx="3" fill="white" stroke="#D9D9D9" stroke-width="1"/><use data-icon="chunk-filled/bolt" x="76" y="223" width="18" height="18" fill="#666666"/><text x="100" y="237" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">草稿 draft</text><text x="78" y="259" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">3 层 / 5 个草稿位置</text><text x="78" y="280" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">5 次马尔可夫校正</text></g><g id="dspark-stage-2"><rect x="252" y="215" width="164" height="76" rx="3" fill="white" stroke="#D9D9D9" stroke-width="1"/><use data-icon="chunk-filled/layers" x="262" y="223" width="18" height="18" fill="#666666"/><text x="286" y="237" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">验证 verify</text><text x="264" y="259" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">6 个目标查询</text><text x="264" y="280" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">完整 64 层 + KV 写入</text></g><g id="dspark-stage-3"><rect x="438" y="215" width="164" height="76" rx="3" fill="white" stroke="#D9D9D9" stroke-width="1"/><use data-icon="chunk-filled/circle-checkmark" x="448" y="223" width="18" height="18" fill="#666666"/><text x="472" y="237" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">提交 commit</text><text x="450" y="259" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">提交 C∈[1,6]</text><text x="450" y="280" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">截断、恢复、追赶窗口</text></g><g id="dspark-flow-arrows"><line x1="231" y1="254" x2="247" y2="254" stroke="#666666" stroke-width="1"/><polygon points="247,254 240.0,257.5 240.0,250.5" fill="#666666"/><line x1="417" y1="254" x2="433" y2="254" stroke="#666666" stroke-width="1"/><polygon points="433,254 426.0,257.5 426.0,250.5" fill="#666666"/></g><g id="dspark-stage-cost"><text x="66" y="313" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">验证后的隐藏态追赶草稿窗口；替换或奖励输出留给下一轮</text><text x="66" y="337" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">C=4 阶段成本（ms）</text><rect x="66" y="347" width="538" height="25" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><text x="74" y="366" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">阶段</text><text x="286" y="366" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">950DT</text><text x="446" y="366" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">960DT</text><text x="74" y="388.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">草稿 draft</text><text x="430" y="388.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">1.093</text><text x="596" y="388.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">0.283</text><line x1="66" y1="398" x2="604" y2="398" stroke="#D9D9D9" stroke-width="1"/><text x="74" y="414.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">目标验证 verify</text><text x="430" y="414.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">25.435</text><text x="596" y="414.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">7.621</text><line x1="66" y1="424" x2="604" y2="424" stroke="#D9D9D9" stroke-width="1"/><text x="74" y="440.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">状态提交 commit</text><text x="430" y="440.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">0.090</text><text x="596" y="440.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">0.031</text><line x1="66" y1="450" x2="604" y2="450" stroke="#D9D9D9" stroke-width="1"/><text x="74" y="466.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">单轮 round</text><text x="430" y="466.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">26.618</text><text x="596" y="466.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">7.935</text><line x1="66" y1="476" x2="604" y2="476" stroke="#D9D9D9" stroke-width="1"/><rect x="66" y="476" width="538" height="26" rx="0" fill="#FFF1EF" stroke="none" stroke-width="1"/><text x="74" y="492.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">折算 TPOT</text><text x="430" y="492.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="end" xml:space="preserve">6.654</text><text x="596" y="492.9" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="end" xml:space="preserve">1.984</text><line x1="66" y1="502" x2="604" y2="502" stroke="#D9D9D9" stroke-width="1"/><text x="66" y="525" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">round 为成批输出间隔；TPOT=round/C 只折算服务成本</text></g><g id="dspark-sensitivity"><rect x="640" y="172" width="590" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="640" y="172" width="590" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/chart-line" x="652" y="176" width="20" height="20" fill="#C00000"/><text x="680" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">C=1…6 的条件敏感性：AR 基线 = 1.00×</text><text x="656" y="219" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">每平台固定上表布局；加速比 = 同布局 AR TPOT ÷ DSpark TPOT</text><rect x="656" y="231" width="558" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><text x="664" y="250" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">提交数</text><text x="726" y="250" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">950 TPOT(ms)</text><text x="871" y="250" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">加速比</text><text x="970" y="250" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">960 TPOT(ms)</text><text x="1115" y="250" font-family="微软雅黑, Arial, 