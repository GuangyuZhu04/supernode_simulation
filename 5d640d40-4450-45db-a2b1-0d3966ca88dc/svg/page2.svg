<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF"/><g id="page-header"><text x="50" y="50" font-family="微软雅黑, Arial, sans-serif" font-size="28" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">CED、CSA2 与 Engram 改写资源路径，阶段成本逐项计入</text><text x="50" y="77" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">02 机制落地 · 合成 Pro-10T 的长提示、共享缓存与主机冷查表均进入资源账本</text></g><g id="core-band"><rect x="50" y="96" width="1180" height="62" rx="4" fill="#FFF1EF" stroke="#C00000" stroke-width="1.5"/><use data-icon="chunk-filled/target-arrow" x="70" y="115" width="22" height="22" fill="#C00000"/><text x="104" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">核心思想</text><line x1="180" y1="110" x2="180" y2="146" stroke="#F1B4B7" stroke-width="1"/><text x="200" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">CED缩短全量路径，CSA2复用状态，Engram下沉主机；</tspan><tspan fill="#C00000" font-weight="bold">阶段成本逐项计费</tspan><tspan fill="#1D1D1A" font-weight="normal">。</tspan></text></g><g id="ced-prefill-route"><rect x="50" y="172" width="380" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="50" y="172" width="380" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/layers" x="62" y="176" width="20" height="20" fill="#C00000"/><text x="90" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">CED：长提示与有界重放</text><text x="66" y="222" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">全量提示词（长度 L）</text><rect x="80" y="235" width="320" height="44" rx="3" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="240" y="263" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">32层编码器处理全量提示词</text><line x1="240" y1="279" x2="240" y2="297" stroke="#666666" stroke-width="1"/><polygon points="240,297 236.5,290.0 243.5,290.0" fill="#666666"/><rect x="80" y="297" width="320" height="44" rx="3" fill="white" stroke="#D9D9D9" stroke-width="1"/><text x="240" y="325" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">编码器终态 → 解码器全局 KV</text><line x1="240" y1="341" x2="240" y2="359" stroke="#666666" stroke-width="1"/><polygon points="240,359 236.5,352.0 243.5,352.0" fill="#666666"/><rect x="80" y="359" width="320" height="56" rx="3" fill="#FFF1EF" stroke="#F1B4B7" stroke-width="1"/><text x="240" y="381" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">末尾 </tspan><tspan fill="#C00000" font-weight="bold">128 token</tspan><tspan fill="#1D1D1A" font-weight="normal"> × 32层解码器重放</tspan></text><text x="240" y="402" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">建立各层 SWA 与首token状态</text><line x1="240" y1="415" x2="240" y2="432" stroke="#666666" stroke-width="1"/><polygon points="240,432 236.5,425.0 243.5,425.0" fill="#666666"/><rect x="80" y="432" width="320" height="38" rx="3" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="240" y="456" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">输出头 → 首 token</text><text x="66" y="493" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">TTFT包含重放、索引与输出头</text><text x="66" y="515" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">不能将旧模型时延简单除二</text></g><g id="csa2-sharing-indexing"><rect x="450" y="172" width="380" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="450" y="172" width="380" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/card-stack" x="462" y="176" width="20" height="20" fill="#C00000"/><text x="490" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">CSA2：共享状态，逐级稀疏</text><text x="466" y="222" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">4个 KV owner · 8个索引 owner</text><rect x="466" y="237" width="108" height="76" rx="3" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="520" y="259" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">Full</text><text x="520" y="282" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">生成共享KV</text><text x="520" y="302" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">生成索引</text><rect x="582" y="237" width="108" height="76" rx="3" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="636" y="259" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">Reindex</text><text x="636" y="282" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">复用共享KV</text><text x="636" y="302" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">重算索引</text><rect x="698" y="237" width="108" height="76" rx="3" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="752" y="259" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">Reuse</text><text x="752" y="282" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">复用共享KV</text><text x="752" y="302" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">复用稀疏位</text><text x="640" y="337" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">各打分tile先跨TP做FP32全归约</text><line x1="640" y1="343" x2="640" y2="355" stroke="#666666" stroke-width="1"/><polygon points="640,355 636.5,348.0 643.5,348.0" fill="#666666"/><rect x="466" y="355" width="348" height="50" rx="3" fill="white" stroke="#D9D9D9" stroke-width="1"/><text x="640" y="385" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">全历史初级索引 → top-512</text><line x1="640" y1="405" x2="640" y2="425" stroke="#666666" stroke-width="1"/><polygon points="640,425 636.5,418.0 643.5,418.0" fill="#666666"/><rect x="466" y="426" width="348" height="47" rx="3" fill="#FFF1EF" stroke="#F1B4B7" stroke-width="1"/><text x="640" y="446" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">后续解码器候选上限 </tspan><tspan fill="#C00000" font-weight="bold">16,384</tspan></text><text x="640" y="465" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">2048块 × 8位置</text><text x="466" y="494" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">候选提前聚集：本仿真优化假设</text><text x="466" y="516" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">公开参考：先全量打分，再屏蔽</text></g><g id="engram-host-route"><rect x="850" y="172" width="380" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="850" y="172" width="380" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/database" x="862" y="176" width="20" height="20" fill="#C00000"/><text x="890" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">Engram：主机分片，冷查表计费</text><text x="1040" y="250" font-family="微软雅黑, Arial, sans-serif" font-size="38" fill="#C00000" font-weight="bold" text-anchor="middle" xml:space="preserve">3.5473</text><text x="1040" y="275" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">TB / DP 副本（FP8 + scale）</text><text x="866" y="302" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">两张ngram表，按行分片至所属主机</text><text x="866" y="324" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">选中行返回路径</text><rect x="866" y="338" width="76" height="59" rx="3" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="904" y="360" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">DRAM</text><text x="904" y="384" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">随机查表</text><line x1="942" y1="368" x2="954" y2="368" stroke="#666666" stroke-width="1"/><polygon points="954,368 947.0,371.5 947.0,364.5" fill="#666666"/><rect x="954" y="338" width="76" height="59" rx="3" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="992" y="360" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">host link</text><text x="992" y="384" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">行传输</text><line x1="1030" y1="368" x2="1042" y2="368" stroke="#666666" stroke-width="1"/><polygon points="1042,368 1035.0,371.5 1035.0,364.5" fill="#666666"/><rect x="1042" y="338" width="76" height="59" rx="3" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="1080" y="360" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">SU</text><text x="1080" y="384" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">跨主机返回</text><line x1="1118" y1="368" x2="1130" y2="368" stroke="#666666" stroke-width="1"/><polygon points="1130,368 1123.0,371.5 1123.0,364.5" fill="#666666"/><rect x="1130" y="338" width="76" height="59" rx="3" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="1168" y="360" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">TP</text><text x="1168" y="384" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="middle" xml:space="preserve">张量分发</text><text x="866" y="424" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">请求：主机哈希 → H2D → SU → D2H</text><text x="866" y="447" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">返回：行 H2D → SU → 本机 → TP</text><line x1="866" y1="465" x2="1214" y2="465" stroke="#D9D9D9" stroke-width="1"/><text x="866" y="490" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">主场景：无缓存命中、无免费预取重叠</text><text x="866" y="514" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">CPU / DRAM / IOPS / host / SU 均计费</text></g><g id="highlight-strip"><rect x="50" y="574" width="1180" height="68" rx="4" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="72" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">本页亮点</text><text x="180" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">★ 长提示只经过编码器；有界重放、索引与输出头的 </tspan><tspan fill="#C00000" font-weight="bold">成本全部保留</tspan><tspan fill="#1D1D1A" font-weight="normal">。</tspan></text><text x="180" y="625" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">★ 状态共享与冷查表同时入账；候选提前聚集属于 </tspan><tspan fill="#C00000" font-weight="bold">仿真假设</tspan><tspan fill="#1D1D1A" font-weight="normal">。</tspan></text></g><g id="source-note-0"><text x="50" y="552" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">边界：32+32层与共享层位属于合成推演；统一FP8，公开原生FP4存储另记；未证明等质量或真机性能。</text></g><g id="source-note-1"><text x="50" y="565" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">来源：methodology.md、model.json、Flash inference/model.py；Engram容量含scale，TB为十进制。</text></g><g id="footer-group" font-family="Arial, sans-serif" font-size="10.5" fill="#1D1D1A"><text x="77" y="683">2</text><text x="125" y="683">Huawei Proprietary - Restricted Distribution</text><image href="logo.png" x="1070" y="663" width="133" height="28" preserveAspectRatio="xMidYMid meet"/></g></svg>