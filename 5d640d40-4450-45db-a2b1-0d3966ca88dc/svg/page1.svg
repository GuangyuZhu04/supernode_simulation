f" font-size="12" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">3.4398T</text><line x1="456" y1="414" x2="1214" y2="414" stroke="#D9D9D9" stroke-width="1"/><text x="464" y="436.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">bulk 活跃：prefill / decode</text><text x="716" y="436.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">7.90B / 16.13B</text><text x="956" y="436.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">76.11B / 155.10B</text><line x1="456" y1="448" x2="1214" y2="448" stroke="#D9D9D9" stroke-width="1"/><text x="464" y="470.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">DSpark 额外参数（另计）</text><text x="716" y="470.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">14.2254B</text><text x="956" y="470.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">34.7556B</text><line x1="456" y1="482" x2="1214" y2="482" stroke="#D9D9D9" stroke-width="1"/><text x="456" y="506" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">骨干规模约为公开 Flash 的 </tspan><tspan fill="#C00000" font-weight="bold">18.34倍</tspan><tspan fill="#1D1D1A" font-weight="normal">；扩展深度、隐藏维与专家池。</tspan></text><text x="456" y="526" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">bulk 活跃计数不等于激活字节，也不含巨型 lookup 表。</text></g><g id="highlight-strip"><rect x="50" y="574" width="1180" height="68" rx="4" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="72" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">本页亮点</text><text x="180" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">★ 骨干 </tspan><tspan fill="#C00000" font-weight="bold">10.1225T</tspan><tspan fill="#1D1D1A" font-weight="normal">；ngram </tspan><tspan fill="#C00000" font-weight="bold">3.4398T</tspan><tspan fill="#1D1D1A" font-weight="normal"> 与 DSpark </tspan><tspan fill="#C00000" font-weight="bold">34.7556B</tspan><tspan fill="#1D1D1A" font-weight="normal"> 另计。</tspan></text><text x="180" y="625" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">★ bulk 活跃 </tspan><tspan fill="#C00000" font-weight="bold">76.11B / 155.10B</tspan><tspan fill="#1D1D1A" font-weight="normal">；有界重放与输出头成本仍全部保留。</tspan></text></g><g id="source-note-0"><text x="50" y="552" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">边界：Pro-10T 为合成研究结构，非公开 Pro 规格；仅文本骨干，不含视觉及投影器，未验证模型质量。</text></g><g id="source-note-1"><text x="50" y="565" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">来源：2026-10-20 架构审计、model.json；公开 Flash 配置锁定 revision 314113f8…，参数为结构计数。</text></g><g id="footer-group" font-family="Arial, sans-serif" font-size="10.5" fill="#1D1D1A"><text x="77" y="683">1</text><text x="125" y="683">Huawei Proprietary - Restricted Distribution</text><image href="logo.png" x="1070" y="663" width="133" height="28" preserveAspectRatio="xMidYMid meet"/></g></svg>