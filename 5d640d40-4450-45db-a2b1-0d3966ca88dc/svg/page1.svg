<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF"/><g id="page-header"><text x="50" y="50" font-family="微软雅黑, Arial, sans-serif" font-size="28" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">DeepSeek V4.1-Pro-10T 合成骨干10.12T，查表与草稿另计</text><text x="50" y="77" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">01 模型演进 · 基于 DeepSeek V4.1 Flash 公开机制与本地合成结构，独立审计文本骨干</text></g><g id="core-band"><rect x="50" y="96" width="1180" height="62" rx="4" fill="#FFF1EF" stroke="#C00000" stroke-width="1.5"/><use data-icon="chunk-filled/target-arrow" x="70" y="115" width="22" height="22" fill="#C00000"/><text x="104" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">核心思想</text><line x1="180" y1="110" x2="180" y2="146" stroke="#F1B4B7" stroke-width="1"/><text x="200" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">名义10T仅指骨干；</tspan><tspan fill="#C00000" font-weight="bold">10.1225T</tspan><tspan fill="#1D1D1A" font-weight="normal">、ngram 与 DSpark 分列，分别约束容量与活跃计算。</tspan></text></g><g id="preserved-backbone"><rect x="50" y="172" width="370" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="50" y="172" width="370" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/layers" x="62" y="176" width="20" height="20" fill="#C00000"/><text x="90" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">保留计算骨架，分开核算规模</text><rect x="66" y="216" width="338" height="68" rx="3" fill="white" stroke="#D9D9D9" stroke-width="1"/><use data-icon="chunk-filled/layers" x="78" y="226" width="20" height="20" fill="#C00000"/><text x="108" y="243" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">CED：编码—解码分工</text><text x="82" y="267" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">32层编码器 → 32层解码器</text><line x1="235" y1="284" x2="235" y2="302" stroke="#666666" stroke-width="1"/><polygon points="235,302 231.5,295.0 238.5,295.0" fill="#666666"/><rect x="66" y="303" width="338" height="68" rx="3" fill="white" stroke="#D9D9D9" stroke-width="1"/><use data-icon="chunk-filled/card-stack" x="78" y="313" width="20" height="20" fill="#C00000"/><text x="108" y="330" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">CSA2：跨层共享与稀疏注意力</text><text x="82" y="354" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">4个 KV owner · 8个索引 owner</text><line x1="235" y1="371" x2="235" y2="389" stroke="#666666" stroke-width="1"/><polygon points="235,389 231.5,382.0 238.5,382.0" fill="#666666"/><rect x="66" y="390" width="338" height="68" rx="3" fill="white" stroke="#D9D9D9" stroke-width="1"/><use data-icon="chunk-filled/database" x="78" y="400" width="20" height="20" fill="#C00000"/><text x="108" y="417" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">mHC + Engram：连接与记忆</text><text x="82" y="441" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">4路残差流 · 主机 ngram 表</text><text x="66" y="487" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">保留共享专家1、SWA=128、输出groups=8</text><text x="66" y="511" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">合成层位映射与模型质量尚未验证</text></g><g id="architecture-parameter-audit"><rect x="440" y="172" width="790" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="440" y="172" width="790" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/chart-bar" x="452" y="176" width="20" height="20" fill="#C00000"/><text x="480" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">公开 Flash 审计 → 本地合成 Pro-10T</text><rect x="456" y="216" width="758" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><text x="464" y="235" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">比较维度</text><text x="716" y="235" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">公开 Flash 配置 / 审计</text><text x="956" y="235" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">合成 Pro-10T</text><text x="464" y="266.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">层数 / 隐藏维</text><text x="716" y="266.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">40 / 5120</text><text x="956" y="266.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">64 / 7168</text><line x1="456" y1="278" x2="1214" y2="278" stroke="#D9D9D9" stroke-width="1"/><text x="464" y="300.1" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve