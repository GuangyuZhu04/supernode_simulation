<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF"/><g id="page-header"><text x="50" y="50" font-family="微软雅黑, Arial, sans-serif" font-size="28" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">新增架构用独立解析模块接入原生资源内核，结果可追溯</text><text x="50" y="77" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">04 仿真方法 · CED / CSA2 / mHC / Engram / DSpark 扩展 · 冻结 supernode_sim 内核</text></g><g id="core-band"><rect x="50" y="96" width="1180" height="62" rx="4" fill="#FFF1EF" stroke="#C00000" stroke-width="1.5"/><use data-icon="chunk-filled/target-arrow" x="70" y="115" width="22" height="22" fill="#C00000"/><text x="104" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">核心思想</text><line x1="180" y1="110" x2="180" y2="146" stroke="#F1B4B7" stroke-width="1"/><text x="200" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="bold">保留原生调度与容量语义；</tspan><tspan fill="#C00000" font-weight="bold">17 组不变量验证</tspan><tspan fill="#1D1D1A" font-weight="bold">通过，</tspan><tspan fill="#C00000" font-weight="bold">性能精度仍待实机校准</tspan><tspan fill="#1D1D1A" font-weight="bold">。</tspan></text></g><g id="fixed-inputs"><rect x="50" y="172" width="365" height="306" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="50" y="172" width="365" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/file" x="62" y="176" width="20" height="20" fill="#C00000"/><text x="90" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">01 固定输入与兼容性</text><text x="66" y="225" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">结构与精度</text><text x="66" y="249" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">逐矩阵参数 · FP8 / FP32 分账</text><text x="66" y="274" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">CED / CSA2 / mHC / Engram / DSpark</text><text x="66" y="310" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">并行与负载</text><text x="66" y="334" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">TP × EP × DP = 1024；PP = 1</text><text x="66" y="358" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">SP 共用 TP；活跃 DP = min(DP, batch)</text><text x="66" y="394" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">45 个候选布局 · 4 种上下文</text><text x="66" y="418" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">decode bs = 1 / 2 / 4 / 8 / 16 / 32</text><text x="66" y="442" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">TP16 / TP32 与 output groups=8 不兼容</text><text x="66" y="466" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">从配置入口保留不兼容结果。</text></g><g id="native-engine"><rect x="455" y="172" width="365" height="306" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="455" y="172" width="365" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/code" x="467" y="176" width="20" height="20" fill="#C00000"/><text x="495" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">02 原生内核执行资源图</text><text x="471" y="225" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">组件 → 阶段 → 原生资源封装</text><rect x="471" y="247" width="105" height="57" rx="0" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><use data-icon="chunk-filled/calculator" x="514" y="254" width="18" height="18" fill="#C00000"/><text x="523.5" y="293" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">计算</text><rect x="584" y="247" width="105" height="57" rx="0" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><use data-icon="chunk-filled/database" x="627" y="254" width="18" height="18" fill="#C00000"/><text x="636.5" y="293" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">HBM</text><rect x="697" y="247" width="105" height="57" rx="0" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><use data-icon="chunk-filled/server" x="740" y="254" width="18" height="18" fill="#C00000"/><text x="749.5" y="293" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">网络 / 主机</text><line x1="637" y1="310" x2="637" y2="328" stroke="#666666" stroke-width="1"/><polygon points="637,328 633.5,321.0 640.5,321.0" fill="#666666"/><rect x="471" y="334" width="333" height="40" rx="0" fill="#FFF1EF" stroke="#F1B4B7" stroke-width="1"/><text x="637.5" y="359" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="middle" xml:space="preserve">依赖屏障 + 带宽 + 容量准入</text><text x="471" y="398" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">计算 / HBM 依 roofline 取主导项</text><text x="471" y="422" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">collective 轮次、端点注入与启动显式计费</text><text x="471" y="446" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">各算子阶段串行；未假设计通重叠</text><text x="471" y="469" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">资源封装保留总物理 FLOPs / bytes 账本</text></g><g id="checks-and-evidence"><rect x="860" y="172" width="370" height="306" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="860" y="172" width="370" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/chart-bar" x="872" y="176" width="20" height="20" fill="#C00000"/><text x="900" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">03 验证与证据留存</text><text x="876" y="228" font-family="微软雅黑, Arial, sans-serif" font-size="38" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">17</text><text x="944" y="225" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">组结构 / 内核校验</text><text x="876" y="255" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">2 / 4 / 8 卡通信图核对 · 异构 rank 计算</text><text x="876" y="280" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">路由守恒 · KV owner · DP 资源独立</text><text x="876" y="316" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">数值与容量账本</text><text x="876" y="340" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">6 类时延可加 · 阶段工作量守恒</text><text x="876" y="364" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">真实失败保留 null；不以零延迟替代</text><text x="876" y="400" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">来源与复现</text><text x="876" y="424" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">CSV / JSON · 原始阶段 · SHA256 指纹</text><text x="876" y="448" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">锁定公开 Flash 配置 / 代码版本</text><text x="876" y="470" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">缩约验证不证明硬件或模型质量。</text></g><g id="matrix-status"><rect x="50" y="492" width="1180" height="46" rx="0" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="66" y="520" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">可行</text><text x="201" y="520" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">7,560</text><line x1="396" y1="501" x2="396" y2="528" stroke="#D9D9D9" stroke-width="1"/><text x="458" y="520" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">容量不可行</text><text x="593" y="520" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">3,528</text><line x1="788" y1="501" x2="788" y2="528" stroke="#D9D9D9" stroke-width="1"/><text x="850" y="520" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">结构不兼容</text><text x="985" y="520" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">4,032</text></g><g id="highlight-strip"><rect x="50" y="574" width="1180" height="68" rx="4" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="72" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">本页亮点</text><text x="180" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">覆盖 </tspan><tspan fill="#C00000" font-weight="bold">15,120</tspan><tspan fill="#1D1D1A" font-weight="normal"> 行 decode 与 </tspan><tspan fill="#C00000" font-weight="bold">1,440</tspan><tspan fill="#1D1D1A" font-weight="normal"> 行 prefill；失败与不兼容行完整保留。</tspan></text><text x="180" y="625" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">TTFT 单列 bs1 / bs8；decode 扫描 bs1–32，</tspan><tspan fill="#C00000" font-weight="bold">固定全局负载，不以新增请求制造 DP 收益</tspan><tspan fill="#1D1D1A" font-weight="normal">。</tspan></text></g><g id="source-note-0"><text x="50" y="552" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">边界：解析资源预测；无 kernel 实测 profile、请求排队、动态 batching、客户端交付与 P99；不与 Kimi 直接作实测加速比较。</text></g><g id="source-note-1"><text x="50" y="565" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">来源：2026-10-20 methodology.md / verification.json / result-verification.json / provenance.json；校验通过不等于精度校准。</text></g><g id="footer-group" font-family="Arial, sans-serif" font-size="10.5" fill="#1D1D1A"><text x="77" y="683">4</text><text x="125" y="683">Huawei Proprietary - Restricted Distribution</text><image href="logo.png" x="1070" y="663" width="133" height="28" preserveAspectRatio="xMidYMid meet"/></g></svg>