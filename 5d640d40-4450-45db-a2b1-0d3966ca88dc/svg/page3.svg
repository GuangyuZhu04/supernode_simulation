<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF"/><g id="page-header"><text x="50" y="50" font-family="微软雅黑, Arial, sans-serif" font-size="28" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">10T 推理需分开预算 HBM 与主机内存，并按阶段校验峰值</text><text x="50" y="77" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">03 硬件与容量 · 参考布局 TP8 / EP128 / DP1 / SP8 · 1M · AR · 每平台 1024 卡</text></g><g id="core-band"><rect x="50" y="96" width="1180" height="62" rx="4" fill="#FFF1EF" stroke="#C00000" stroke-width="1.5"/><use data-icon="chunk-filled/target-arrow" x="70" y="115" width="22" height="22" fill="#C00000"/><text x="104" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">核心思想</text><line x1="180" y1="110" x2="180" y2="146" stroke="#F1B4B7" stroke-width="1"/><text x="200" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="bold">同一布局：</tspan><tspan fill="#C00000" font-weight="bold">prefill 峰值高于 decode</tspan><tspan fill="#1D1D1A" font-weight="bold">；Engram 表驻留主机，随 DP 副本数增长。</tspan></text></g><g id="phase-capacity"><rect x="50" y="172" width="380" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="50" y="172" width="380" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/database" x="62" y="176" width="20" height="20" fill="#C00000"/><text x="90" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">HBM：按阶段与物理副本计容</text><text x="66" y="246" font-family="微软雅黑, Arial, sans-serif" font-size="38" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">62.02</text><text x="210" y="244" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">GB / 卡</text><text x="66" y="273" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">prefill bs1 峰值 · 两平台容量账本相同</text><text x="66" y="318" font-family="微软雅黑, Arial, sans-serif" font-size="38" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">27.40</text><text x="210" y="316" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">GB / 卡</text><text x="66" y="345" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">decode bs32 峰值 · 不能替代 prefill 预算</text><rect x="66" y="364" width="348" height="26" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><text x="74" y="383" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">组成 / 阶段</text><text x="284" y="383" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">容量</text><text x="74" y="408.2" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">每卡权重 + scale</text><text x="284" y="408.2" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">17.13 GB</text><line x1="66" y1="418" x2="414" y2="418" stroke="#D9D9D9" stroke-width="1"/><text x="74" y="436.2" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">每卡运行时</text><text x="284" y="436.2" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">8 GB</text><line x1="66" y1="446" x2="414" y2="446" stroke="#D9D9D9" stroke-width="1"/><text x="74" y="464.2" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">每卡工作区</text><text x="284" y="464.2" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">256 MB</text><line x1="66" y1="474" x2="414" y2="474" stroke="#D9D9D9" stroke-width="1"/><text x="74" y="492.2" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">prefill bs8 峰值</text><text x="284" y="492.2" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">78.74 GB</text><line x1="66" y1="502" x2="414" y2="502" stroke="#D9D9D9" stroke-width="1"/><text x="66" y="521" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">峰值包含最终 KV 预留、激活与暂存空间。</text></g><g id="hardware-inputs"><rect x="450" y="172" width="380" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="450" y="172" width="380" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/server" x="462" y="176" width="20" height="20" fill="#C00000"/><text x="490" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">算力与带宽：分精度建模</text><rect x="466" y="215" width="348" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><text x="474" y="234" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">每卡规格</text><text x="612" y="234" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">950DT</text><text x="717" y="234" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">960DT</text><text x="474" y="263.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">HBM 容量</text><text x="612" y="263.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">144 GB</text><text x="717" y="263.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">288 GB</text><line x1="466" y1="274" x2="814" y2="274" stroke="#D9D9D9" stroke-width="1"/><text x="474" y="294.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">HBM 带宽</text><text x="612" y="294.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">4 TB/s</text><text x="717" y="294.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">9.6 TB/s</text><line x1="466" y1="305" x2="814" y2="305" stroke="#D9D9D9" stroke-width="1"/><text x="474" y="325.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">FP8 峰值</text><text x="612" y="325.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">1 PFLOP/s</text><text x="717" y="325.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">2 PFLOP/s</text><line x1="466" y1="336" x2="814" y2="336" stroke="#D9D9D9" stroke-width="1"/><text x="474" y="356.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">FP32 峰值</text><text x="612" y="356.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">50 TFLOP/s</text><text x="717" y="356.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">50 TFLOP/s</text><line x1="466" y1="367" x2="814" y2="367" stroke="#D9D9D9" stroke-width="1"/><text x="474" y="387.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">计算效率</text><text x="612" y="387.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">50%</text><text x="717" y="387.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">50%</text><line x1="466" y1="398" x2="814" y2="398" stroke="#D9D9D9" stroke-width="1"/><line x1="466" y1="418" x2="814" y2="418" stroke="#D9D9D9" stroke-width="1"/><text x="466" y="442" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">主对照统一 FP8</text><text x="466" y="466" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">权重 / 计算 / 激活 / 通信 / KV</text><text x="466" y="490" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">router、mHC、norm 与标量：显式 FP32</text><text x="466" y="520" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">公开 FP4 格式单列；未假设其算力倍率。</text></g><g id="host-and-network"><rect x="850" y="172" width="380" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="850" y="172" width="380" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/arrow-left-arrow-right" x="862" y="176" width="20" height="20" fill="#C00000"/><text x="890" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">互联与主机：查表成本不省略</text><rect x="866" y="215" width="348" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><text x="874" y="234" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">每卡互联</text><text x="1012" y="234" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">950DT</text><text x="1117" y="234" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">960DT</text><text x="874" y="263.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">SU / 方向</text><text x="1012" y="263.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">1 TB/s</text><text x="1117" y="263.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">1.1 TB/s</text><line x1="866" y1="274" x2="1214" y2="274" stroke="#D9D9D9" stroke-width="1"/><text x="874" y="294.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">SU 启动</text><text x="1012" y="294.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">2.1 μs</text><text x="1117" y="294.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">1 μs</text><line x1="866" y1="305" x2="1214" y2="305" stroke="#D9D9D9" stroke-width="1"/><text x="874" y="325.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">SU 效率</text><text x="1012" y="325.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">80%</text><text x="1117" y="325.15" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">80%</text><line x1="866" y1="336" x2="1214" y2="336" stroke="#D9D9D9" stroke-width="1"/><text x="866" y="374" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">Engram：每副本主机驻留</text><text x="866" y="419" font-family="微软雅黑, Arial, sans-serif" font-size="38" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">3.5473</text><text x="1070" y="416" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">TB</text><text x="866" y="445" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">每主机 4 TB DRAM · 512 GB/s · 10⁸ IOPS</text><text x="866" y="469" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">host link：64 GB/s × 85% · 2 μs</text><text x="866" y="493" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">表按行分片，地址和返回行均进入账本。</text><text x="866" y="521" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">无 cache 命中；无免费预取或传输重叠。</text></g><g id="highlight-strip"><rect x="50" y="574" width="1180" height="68" rx="4" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="72" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">本页亮点</text><text x="180" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">参考布局峰值：prefill bs1 </tspan><tspan fill="#C00000" font-weight="bold">62.02 GB</tspan><tspan fill="#1D1D1A" font-weight="normal">；decode bs32 </tspan><tspan fill="#C00000" font-weight="bold">27.40 GB</tspan><tspan fill="#1D1D1A" font-weight="normal">，两种负载分别核对。</tspan></text><text x="180" y="625" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">主机侧 ngram 每 DP 副本 </tspan><tspan fill="#C00000" font-weight="bold">3.5473 TB</tspan><tspan fill="#1D1D1A" font-weight="normal">；扩 DP 时同时增加权重与查表容量。</tspan></text></g><g id="source-note-0"><text x="50" y="552" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">口径：TTFT 对应 prefill 全局 bs1；decode 全局 bs32。单个逻辑非阻塞 SU；普通通信不走 SO。</text></g><g id="source-note-1"><text x="50" y="565" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">来源：2026-10-20 experiment.json / prefill.csv / summary.csv；容量、带宽为十进制；硬件与效率均未实测校准。</text></g><g id="footer-group" font-family="Arial, sans-serif" font-size="10.5" fill="#1D1D1A"><text x="77" y="683">3</text><text x="125" y="683">Huawei Proprietary - Restricted Distribution</text><image href="logo.png" x="1070" y="663" width="133" height="28" preserveAspectRatio="xMidYMid meet"/></g></svg>