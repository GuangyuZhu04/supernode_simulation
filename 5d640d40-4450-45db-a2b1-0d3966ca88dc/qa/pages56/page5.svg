<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF"/><g id="page-header"><text x="50" y="50" font-family="微软雅黑, Arial, sans-serif" font-size="28" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">调整并行组合可提升 1M 吞吐，代价是 TTFT 与驻留容量增加</text><text x="50" y="77" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">1024 卡、统一 FP8、AR 基线；在相同上下文和 decode batch 下比较参考布局与扫描内最小 TPOT 布局</text></g><g id="core-band"><rect x="50" y="96" width="1180" height="62" rx="4" fill="#FFF1EF" stroke="#C00000" stroke-width="1.5"/><use data-icon="chunk-filled/target-arrow" x="70" y="115" width="22" height="22" fill="#C00000"/><text x="104" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">核心思想</text><line x1="180" y1="110" x2="180" y2="146" stroke="#F1B4B7" stroke-width="1"/><text x="200" y="132" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="bold">950DT / 960DT 吞吐分别提升 </tspan><tspan fill="#C00000" font-weight="bold">+136.1% / +330.0%</tspan><tspan fill="#1D1D1A" font-weight="bold">，首 token 时间需独立权衡</tspan></text></g><g id="ar-result-table"><rect x="50" y="172" width="820" height="366" rx="0" fill="white" stroke="#D9D9D9" stroke-width="1"/><rect x="50" y="172" width="820" height="28" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><use data-icon="chunk-filled/table" x="62" y="176" width="20" height="20" fill="#C00000"/><text x="90" y="192" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">1M 四组代表结果：时延、吞吐与容量一起看</text><rect x="63" y="216" width="794" height="43" rx="0" fill="#F2F2F2" stroke="none" stroke-width="1"/><text x="71" y="233" fon