ext><text x="907" y="349" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="bold">960DT   </tspan><tspan fill="#C00000" font-weight="bold">+330.0%</tspan></text><text x="907" y="379" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">参考</text><rect x="948" y="367" width="45.7583054366781" height="16" rx="0" fill="#BFBFBF" stroke="none" stroke-width="1"/><text x="1216" y="379" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="end" xml:space="preserve">1455.95</text><text x="907" y="411" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">优选</text><rect x="948" y="399" width="196.77118569977955" height="16" rx="0" fill="#C00000" stroke="none" stroke-width="1"/><text x="1216" y="411" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="end" xml:space="preserve">6260.90</text><line x1="948" y1="430" x2="1168" y2="430" stroke="#D9D9D9" stroke-width="1"/><line x1="948.0" y1="430" x2="948.0" y2="434" stroke="#D9D9D9" stroke-width="1"/><text x="948.0" y="449" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="middle" xml:space="preserve">0</text><line x1="1058.0" y1="430" x2="1058.0" y2="434" stroke="#D9D9D9" stroke-width="1"/><text x="1058.0" y="449" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="middle" xml:space="preserve">3500</text><line x1="1168.0" y1="430" x2="1168.0" y2="434" stroke="#D9D9D9" stroke-width="1"/><text x="1168.0" y="449" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="middle" xml:space="preserve">7000</text><text x="907" y="477" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">共同横轴：0–7000 tokens/s</text><text x="907" y="501" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">吞吐 = global bs / TPOT（秒）</text><text x="907" y="524" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">每轮输出 1 token / 序列</text></g><g id="highlight-strip"><rect x="50" y="574" width="1180" height="68" rx="4" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1"/><text x="72" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">本页亮点</text><text x="180" y="600" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve"><tspan fill="#1D1D1A" font-weight="normal">★ 吞吐收益 </tspan><tspan fill="#C00000" font-weight="bold">+136.1% / +330.0%</tspan><tspan fill="#1D1D1A" font-weight="normal">；单请求 TTFT 代价 </tspan><tspan fill="#C00000" font-weight="bold">+1.7% / +25.8%</tspan><tspan fill="#1D1D1A" font-weight="normal">（950DT / 960DT）</tspan></text><text x="180" y="625" font-family="微软雅黑, Arial, sans-serif" font-size="15" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">★ 约束 TTFT 不劣于参考布局时，本扫描未找到更低 TPOT 的替代布局</text></g><g id="source-note-0"><text x="50" y="552" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">来源：2026-10-20 本地解析仿真；summary.csv、prefill.csv、recommendations.csv。1M = 1,048,576 token；条件预测，非真机测量。</text></g><g id="source-note-1"><text x="50" y="565" font-family="微软雅黑, Arial, sans-serif" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" xml:space="preserve">口径：TTFT = prefill 全局 bs1；TPOT / 吞吐 = decode 全局 bs32。分阶段可行不等于 32 请求同时 prefill 的端到端容量保证。</text></g><g id="footer-group" font-family="Arial, sans-serif" font-size="10.5" fill="#1D1D1A"><text x="77" y="683">5</text><text x="125" y="683">Huawei Proprietary - Restricted Distribution</text><image href="logo.png" x="1070" y="663" width="133" height="28" preserveAspectRatio="xMidYMid meet"/></g></svg>