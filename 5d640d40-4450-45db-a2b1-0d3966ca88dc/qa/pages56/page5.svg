erif" font-size="12" fill="#C00000" font-weight="bold" text-anchor="start" xml:space="preserve">1630.34</text><text x="629" y="327" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">98.30</text><text x="747" y="327" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">57.02</text><line x1="63" y1="343" x2="857" y2="343" stroke="#D9D9D9" stroke-width="1"/><text x="71" y="369" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">960DT·参考</text><text x="183" y="369" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">8/128/1/8</text><text x="313" y="369" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">34.05</text><text x="415" y="369" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">21.98</text><text x="519" y="369" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">1455.95</text><text x="629" y="369" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">62.02</text><text x="747" y="369" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="normal" text-anchor="start" xml:space="preserve">27.40</text><line x1="63" y1="385" x2="857" y2="385" stroke="#D9D9D9" stroke-width="1"/><rect x="63" y="385" width="794" height="42" rx="0" fill="#FFF1EF" stroke="none" stroke-width="1"/><text x="71" y="411" font-family="微软雅黑, Arial, sans-serif" font-size="12" fill="#1D1D1A" font-weight="bold" text-anchor="start" xml:space="preserve">960DT·优选</